<html><body><template><style>#root{position:absolute;inset:0;font-family:Montserrat,sans-serif}.caption{position:absolute;left:192px;right:192px;top:927px;height:48px;display:flex;justify-content:center;align-items:center;font-size:33px;color:#142A45;white-space:nowrap}</style><div id="root" data-composition-id="inv-captions" data-width="1920" data-height="1080" data-duration="142.36666666666667"><div class="clip caption" id="inv-caption-0" data-start="0.498" data-duration="3.431" data-track-index="0">Workday Inventory connects receiving, stock movements, and</div><div class="clip caption" id="inv-caption-1" data-start="3.929" data-duration="1.267" data-track-index="0">financial records.</div><div class="clip caption" id="inv-caption-2" data-start="5.363" data-duration="2.880" data-track-index="0">This prototype explores how visual evidence could</div><div class="clip caption" id="inv-caption-3" data-start="8.243" data-duration="2.395" data-track-index="0">help a receiving team review a delivery.</div><div class="clip caption" id="inv-caption-4" data-start="10.792" data-duration="2.088" data-track-index="0">A barcode identifies the item.</div><div class="clip caption" id="inv-caption-5" data-start="13.035" data-duration="1.544" data-track-index="0">A short video adds a view of</div><div class="clip caption" id="inv-caption-6" data-start="14.579" data-duration="1.672" data-track-index="0">its packaging and handling.</div><div class="clip caption" id="inv-caption-7" data-start="16.405" data-duration="2.039" data-track-index="0">In this clip, the carton is opened.</div><div class="clip caption" id="inv-caption-8" data-start="18.599" data-duration="3.963" data-track-index="0">Jev Omni evaluates four possible observations directly,</div><div class="clip caption" id="inv-caption-9" data-start="22.618" data-duration="1.525" data-track-index="0">and ranks opening first.</div><div class="clip caption" id="inv-caption-10" data-start="24.297" data-duration="2.186" data-track-index="0">The percentages compare those answers;</div><div class="clip caption" id="inv-caption-11" data-start="26.515" data-duration="2.039" data-track-index="0">the source stays beside the result.</div><div class="clip caption" id="inv-caption-12" data-start="28.709" data-duration="1.794" data-track-index="0">Now we add the business context.</div><div class="clip caption" id="inv-caption-13" data-start="30.670" data-duration="1.679" data-track-index="0">The same photo could belong to an</div><div class="clip caption" id="inv-caption-14" data-start="32.349" data-duration="2.843" data-track-index="0">authorized contents inspection, where an open box</div><div class="clip caption" id="inv-caption-15" data-start="35.192" data-duration="0.936" data-track-index="0">is expected.</div><div class="clip caption" id="inv-caption-16" data-start="36.282" data-duration="1.642" data-track-index="0">Or it could be submitted as proof</div><div class="clip caption" id="inv-caption-17" data-start="37.925" data-duration="1.843" data-track-index="0">of the package&#x27;s arrival condition.</div><div class="clip caption" id="inv-caption-18" data-start="39.922" data-duration="2.145" data-track-index="0">In that case, our example rule asks</div><div class="clip caption" id="inv-caption-19" data-start="42.067" data-duration="2.022" data-track-index="0">for an earlier photo, before the box</div><div class="clip caption" id="inv-caption-20" data-start="44.089" data-duration="0.765" data-track-index="0">was opened.</div><div class="clip caption" id="inv-caption-21" data-start="45.020" data-duration="2.341" data-track-index="0">The prototype keeps the selected action, the</div><div class="clip caption" id="inv-caption-22" data-start="47.361" data-duration="2.909" data-track-index="0">supplied rule, and the original evidence together.</div><div class="clip caption" id="inv-caption-23" data-start="50.425" data-duration="1.912" data-track-index="0">A receiver can review the packet and</div><div class="clip caption" id="inv-caption-24" data-start="52.336" data-duration="2.475" data-track-index="0">request the missing view before continuing the</div><div class="clip caption" id="inv-caption-25" data-start="54.812" data-duration="1.341" data-track-index="0">receiving process.</div><div class="clip caption" id="inv-caption-26" data-start="56.319" data-duration="1.806" data-track-index="0">Here is how the technology works.</div><div class="clip caption" id="inv-caption-27" data-start="58.280" data-duration="3.260" data-track-index="0">TypeSafe&#x27;s original Jev turns text and structured</div><div class="clip caption" id="inv-caption-28" data-start="61.540" data-duration="2.211" data-track-index="0">questions into typed decisions.</div><div class="clip caption" id="inv-caption-29" data-start="63.905" data-duration="2.586" data-track-index="0">Jev Omni is an independent open model</div><div class="clip caption" id="inv-caption-30" data-start="66.491" data-duration="2.586" data-track-index="0">with a similar decision interface and multimodal</div><div class="clip caption" id="inv-caption-31" data-start="69.076" data-duration="0.777" data-track-index="0">inputs.</div><div class="clip caption" id="inv-caption-32" data-start="70.008" data-duration="2.701" data-track-index="0">Our video path samples sixteen frames.</div><div class="clip caption" id="inv-caption-33" data-start="72.863" data-duration="2.573" data-track-index="0">Those images enter a vision encoder, then</div><div class="clip caption" id="inv-caption-34" data-start="75.437" data-duration="2.402" data-track-index="0">a shared language backbone processes them with</div><div class="clip caption" id="inv-caption-35" data-start="77.839" data-duration="3.154" data-track-index="0">the question, context, and candidate answers.</div><div class="clip caption" id="inv-caption-36" data-start="81.148" data-duration="2.586" data-track-index="0">A classification head scores the options in</div><div class="clip caption" id="inv-caption-37" data-start="83.733" data-duration="1.341" data-track-index="0">one forward pass.</div><div class="clip caption" id="inv-caption-38" data-start="85.241" data-duration="2.770" data-track-index="0">Softmax converts those scores into the percentages</div><div class="clip caption" id="inv-caption-39" data-start="88.010" data-duration="0.887" data-track-index="0">we display.</div><div class="clip caption" id="inv-caption-40" data-start="89.064" data-duration="1.973" data-track-index="0">This avoids generating an answer word by</div><div class="clip caption" id="inv-caption-41" data-start="91.037" data-duration="0.593" data-track-index="0">word.</div><div class="clip caption" id="inv-caption-42" data-start="91.797" data-duration="1.912" data-track-index="0">The result is easy for software to</div><div class="clip caption" id="inv-caption-43" data-start="93.709" data-duration="2.468" data-track-index="0">route and for a reviewer to inspect.</div><div class="clip caption" id="inv-caption-44" data-start="96.331" data-duration="2.488" data-track-index="0">The important evaluation question is whether that</div><div class="clip caption" id="inv-caption-45" data-start="98.819" data-duration="2.382" data-track-index="0">decision is supported by the evidence.</div><div class="clip caption" id="inv-caption-46" data-start="101.356" data-duration="2.279" data-track-index="0">In this restricted crop, the model gave</div><div class="clip caption" id="inv-caption-47" data-start="103.635" data-duration="2.525" data-track-index="0">closed carton eighty percent, although the full</div><div class="clip caption" id="inv-caption-48" data-start="106.160" data-duration="1.402" data-track-index="0">closure was out of view.</div><div class="clip caption" id="inv-caption-49" data-start="107.716" data-duration="2.059" data-track-index="0">A strong score can still accompany weak</div><div class="clip caption" id="inv-caption-50" data-start="109.775" data-duration="0.765" data-track-index="0">evidence.</div><div class="clip caption" id="inv-caption-51" data-start="110.706" data-duration="1.880" data-track-index="0">That case stays in the test set.</div><div class="clip caption" id="inv-caption-52" data-start="112.753" data-duration="2.230" data-track-index="0">The seven-second clip took about three point</div><div class="clip caption" id="inv-caption-53" data-start="114.983" data-duration="3.640" data-track-index="0">three seconds, including preprocessing and local GPU</div><div class="clip caption" id="inv-caption-54" data-start="118.623" data-duration="0.826" data-track-index="0">inference.</div><div class="clip caption" id="inv-caption-55" data-start="119.603" data-duration="1.507" data-track-index="0">Image calls took around a quarter of</div><div class="clip caption" id="inv-caption-56" data-start="121.111" data-duration="0.716" data-track-index="0">a second.</div><div class="clip caption" id="inv-caption-57" data-start="122.054" data-duration="2.525" data-track-index="0">For a receiving workflow, the opportunity is</div><div class="clip caption" id="inv-caption-58" data-start="124.579" data-duration="3.015" data-track-index="0">a compact evidence check: identify the item,</div><div class="clip caption" id="inv-caption-59" data-start="127.594" data-duration="2.647" data-track-index="0">inspect the visible condition, apply the capture</div><div class="clip caption" id="inv-caption-60" data-start="130.241" data-duration="2.083" data-track-index="0">context, and give the receiver a clear</div><div class="clip caption" id="inv-caption-61" data-start="132.324" data-duration="0.887" data-track-index="0">next step.</div><div class="clip caption" id="inv-caption-62" data-start="133.378" data-duration="2.978" data-track-index="0">The learning repository includes the prompts, recorded</div><div class="clip caption" id="inv-caption-63" data-start="136.356" data-duration="2.904" data-track-index="0">results, and this review prototype so others</div><div class="clip caption" id="inv-caption-64" data-start="139.260" data-duration="1.880" data-track-index="0">can explore the same questions.</div></div><script>window.__timelines["inv-captions"]=gsap.timeline({paused:true});</script></template></body></html>
