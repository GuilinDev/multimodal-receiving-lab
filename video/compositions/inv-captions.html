<html><body><template><style>#root{position:absolute;inset:0;font-family:Montserrat,sans-serif}.caption{position:absolute;left:192px;right:192px;top:927px;height:48px;display:flex;justify-content:center;align-items:center;font-size:33px;color:#142A45;white-space:nowrap}</style><div id="root" data-composition-id="inv-captions" data-width="1920" data-height="1080" data-duration="156.26666666666668"><div class="clip caption" id="inv-caption-0" data-start="0.498" data-duration="3.391" data-track-index="0">Workday Inventory connects receiving, stock movements, and</div><div class="clip caption" id="inv-caption-1" data-start="3.929" data-duration="1.227" data-track-index="0">financial records.</div><div class="clip caption" id="inv-caption-2" data-start="5.363" data-duration="2.840" data-track-index="0">This prototype explores how visual evidence could</div><div class="clip caption" id="inv-caption-3" data-start="8.243" data-duration="2.355" data-track-index="0">help a receiving team review a delivery.</div><div class="clip caption" id="inv-caption-4" data-start="10.792" data-duration="2.048" data-track-index="0">A barcode identifies the item.</div><div class="clip caption" id="inv-caption-5" data-start="13.035" data-duration="1.504" data-track-index="0">A short video adds a view of</div><div class="clip caption" id="inv-caption-6" data-start="14.579" data-duration="1.632" data-track-index="0">its packaging and handling.</div><div class="clip caption" id="inv-caption-7" data-start="16.405" data-duration="1.999" data-track-index="0">In this clip, the carton is opened.</div><div class="clip caption" id="inv-caption-8" data-start="18.599" data-duration="3.923" data-track-index="0">Jev Omni evaluates four possible observations directly,</div><div class="clip caption" id="inv-caption-9" data-start="22.618" data-duration="1.485" data-track-index="0">and ranks opening first.</div><div class="clip caption" id="inv-caption-10" data-start="24.297" data-duration="2.146" data-track-index="0">The percentages compare those answers;</div><div class="clip caption" id="inv-caption-11" data-start="26.515" data-duration="1.999" data-track-index="0">the source stays beside the result.</div><div class="clip caption" id="inv-caption-12" data-start="28.709" data-duration="1.700" data-track-index="0">We can also make the object boundary</div><div class="clip caption" id="inv-caption-13" data-start="30.449" data-duration="0.811" data-track-index="0">explicit.</div><div class="clip caption" id="inv-caption-14" data-start="31.478" data-duration="2.117" data-track-index="0">Here, SAM three point one tracks the</div><div class="clip caption" id="inv-caption-15" data-start="33.635" data-duration="1.962" data-track-index="0">carton and its moving flaps.</div><div class="clip caption" id="inv-caption-16" data-start="35.804" data-duration="2.301" data-track-index="0">The blue mask adds spatial evidence to</div><div class="clip caption" id="inv-caption-17" data-start="38.145" data-duration="1.031" data-track-index="0">the review packet.</div><div class="clip caption" id="inv-caption-18" data-start="39.371" data-duration="1.982" data-track-index="0">Jev uses the original video for its</div><div class="clip caption" id="inv-caption-19" data-start="41.393" data-duration="1.019" data-track-index="0">separate decision.</div><div class="clip caption" id="inv-caption-20" data-start="42.606" data-duration="1.754" data-track-index="0">Now we add the business context.</div><div class="clip caption" id="inv-caption-21" data-start="44.567" data-duration="1.639" data-track-index="0">The same photo could belong to an</div><div class="clip caption" id="inv-caption-22" data-start="46.246" data-duration="2.803" data-track-index="0">authorized contents inspection, where an open box</div><div class="clip caption" id="inv-caption-23" data-start="49.089" data-duration="0.896" data-track-index="0">is expected.</div><div class="clip caption" id="inv-caption-24" data-start="50.179" data-duration="1.602" data-track-index="0">Or it could be submitted as proof</div><div class="clip caption" id="inv-caption-25" data-start="51.822" data-duration="1.803" data-track-index="0">of the package&#x27;s arrival condition.</div><div class="clip caption" id="inv-caption-26" data-start="53.819" data-duration="2.105" data-track-index="0">In that case, our example rule asks</div><div class="clip caption" id="inv-caption-27" data-start="55.964" data-duration="1.982" data-track-index="0">for an earlier photo, before the box</div><div class="clip caption" id="inv-caption-28" data-start="57.986" data-duration="0.725" data-track-index="0">was opened.</div><div class="clip caption" id="inv-caption-29" data-start="58.917" data-duration="2.301" data-track-index="0">The prototype keeps the selected action, the</div><div class="clip caption" id="inv-caption-30" data-start="61.258" data-duration="2.869" data-track-index="0">supplied rule, and the original evidence together.</div><div class="clip caption" id="inv-caption-31" data-start="64.322" data-duration="1.872" data-track-index="0">A receiver can review the packet and</div><div class="clip caption" id="inv-caption-32" data-start="66.233" data-duration="2.436" data-track-index="0">request the missing view before continuing the</div><div class="clip caption" id="inv-caption-33" data-start="68.709" data-duration="1.301" data-track-index="0">receiving process.</div><div class="clip caption" id="inv-caption-34" data-start="70.216" data-duration="1.766" data-track-index="0">Here is how the technology works.</div><div class="clip caption" id="inv-caption-35" data-start="72.177" data-duration="3.220" data-track-index="0">TypeSafe&#x27;s original Jev turns text and structured</div><div class="clip caption" id="inv-caption-36" data-start="75.437" data-duration="2.171" data-track-index="0">questions into typed decisions.</div><div class="clip caption" id="inv-caption-37" data-start="77.802" data-duration="2.546" data-track-index="0">Jev Omni is an independent open model</div><div class="clip caption" id="inv-caption-38" data-start="80.388" data-duration="2.546" data-track-index="0">with a similar decision interface and multimodal</div><div class="clip caption" id="inv-caption-39" data-start="82.974" data-duration="0.737" data-track-index="0">inputs.</div><div class="clip caption" id="inv-caption-40" data-start="83.905" data-duration="2.661" data-track-index="0">Our video path samples sixteen frames.</div><div class="clip caption" id="inv-caption-41" data-start="86.760" data-duration="2.534" data-track-index="0">Those images enter a vision encoder, then</div><div class="clip caption" id="inv-caption-42" data-start="89.334" data-duration="2.362" data-track-index="0">a shared language backbone processes them with</div><div class="clip caption" id="inv-caption-43" data-start="91.736" data-duration="3.114" data-track-index="0">the question, context, and candidate answers.</div><div class="clip caption" id="inv-caption-44" data-start="95.045" data-duration="2.546" data-track-index="0">A classification head scores the options in</div><div class="clip caption" id="inv-caption-45" data-start="97.630" data-duration="1.301" data-track-index="0">one forward pass.</div><div class="clip caption" id="inv-caption-46" data-start="99.138" data-duration="2.730" data-track-index="0">Softmax converts those scores into the percentages</div><div class="clip caption" id="inv-caption-47" data-start="101.907" data-duration="0.847" data-track-index="0">we display.</div><div class="clip caption" id="inv-caption-48" data-start="102.961" data-duration="1.933" data-track-index="0">This avoids generating an answer word by</div><div class="clip caption" id="inv-caption-49" data-start="104.934" data-duration="0.553" data-track-index="0">word.</div><div class="clip caption" id="inv-caption-50" data-start="105.694" data-duration="1.872" data-track-index="0">The result is easy for software to</div><div class="clip caption" id="inv-caption-51" data-start="107.606" data-duration="2.428" data-track-index="0">route and for a reviewer to inspect.</div><div class="clip caption" id="inv-caption-52" data-start="110.228" data-duration="2.448" data-track-index="0">The important evaluation question is whether that</div><div class="clip caption" id="inv-caption-53" data-start="112.716" data-duration="2.342" data-track-index="0">decision is supported by the evidence.</div><div class="clip caption" id="inv-caption-54" data-start="115.253" data-duration="2.239" data-track-index="0">In this restricted crop, the model gave</div><div class="clip caption" id="inv-caption-55" data-start="117.532" data-duration="2.484" data-track-index="0">closed carton eighty percent, although the full</div><div class="clip caption" id="inv-caption-56" data-start="120.057" data-duration="1.362" data-track-index="0">closure was out of view.</div><div class="clip caption" id="inv-caption-57" data-start="121.613" data-duration="2.019" data-track-index="0">A strong score can still accompany weak</div><div class="clip caption" id="inv-caption-58" data-start="123.672" data-duration="0.725" data-track-index="0">evidence.</div><div class="clip caption" id="inv-caption-59" data-start="124.603" data-duration="1.840" data-track-index="0">That case stays in the test set.</div><div class="clip caption" id="inv-caption-60" data-start="126.650" data-duration="2.190" data-track-index="0">The seven-second clip took about three point</div><div class="clip caption" id="inv-caption-61" data-start="128.880" data-duration="3.600" data-track-index="0">three seconds, including preprocessing and local GPU</div><div class="clip caption" id="inv-caption-62" data-start="132.520" data-duration="0.786" data-track-index="0">inference.</div><div class="clip caption" id="inv-caption-63" data-start="133.501" data-duration="1.467" data-track-index="0">Image calls took around a quarter of</div><div class="clip caption" id="inv-caption-64" data-start="135.008" data-duration="0.676" data-track-index="0">a second.</div><div class="clip caption" id="inv-caption-65" data-start="135.951" data-duration="2.485" data-track-index="0">For a receiving workflow, the opportunity is</div><div class="clip caption" id="inv-caption-66" data-start="138.476" data-duration="2.975" data-track-index="0">a compact evidence check: identify the item,</div><div class="clip caption" id="inv-caption-67" data-start="141.491" data-duration="2.607" data-track-index="0">inspect the visible condition, apply the capture</div><div class="clip caption" id="inv-caption-68" data-start="144.138" data-duration="2.043" data-track-index="0">context, and give the receiver a clear</div><div class="clip caption" id="inv-caption-69" data-start="146.221" data-duration="0.847" data-track-index="0">next step.</div><div class="clip caption" id="inv-caption-70" data-start="147.275" data-duration="2.938" data-track-index="0">The learning repository includes the prompts, recorded</div><div class="clip caption" id="inv-caption-71" data-start="150.253" data-duration="2.864" data-track-index="0">results, and this review prototype so others</div><div class="clip caption" id="inv-caption-72" data-start="153.157" data-duration="1.840" data-track-index="0">can explore the same questions.</div></div><script>window.__timelines["inv-captions"]=gsap.timeline({paused:true});</script></template></body></html>
